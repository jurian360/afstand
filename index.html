<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afstand per minuut</title>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Afstand">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --line: #e2e2e2;
    --stripe: #f5f5f5;
    --field: #ffffff;
    --accent: #0a66d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --line: #2c2c2c;
      --stripe: #1b1b1b;
      --field: #1e1e1e;
      --accent: #5aa2ff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding:
      calc(env(safe-area-inset-top) + 16px)
      calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + 16px)
      calc(env(safe-area-inset-left) + 16px);
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field { display: flex; align-items: center; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1.5rem;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--field);
    color: var(--fg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .unit { color: var(--muted); font-size: 1.1rem; }
  #perMin { margin: 12px 0 20px; font-size: 1.1rem; }
  #perMin strong { color: var(--accent); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 6px; text-align: right; }
  th { font-size: 0.8rem; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
  td:first-child, th:first-child { text-align: left; color: var(--muted); }
  tbody tr:nth-child(even) { background: var(--stripe); }
</style>
</head>
<body>
<main>
  <h1>Afstand per minuut</h1>

  <label for="speed">Gemiddelde snelheid</label>
  <div class="field">
    <input id="speed" type="text" inputmode="decimal" autocomplete="off" value="45">
    <span class="unit">km/u</span>
  </div>

  <p id="perMin"></p>

  <div class="cols">
    <table>
      <thead><tr><th>Min</th><th>km</th></tr></thead>
      <tbody id="col1"></tbody>
    </table>
    <table>
      <thead><tr><th>Min</th><th>km</th></tr></thead>
      <tbody id="col2"></tbody>
    </table>
  </div>
</main>

<script>
  var KEY = 'afstand-snelheid';
  var input = document.getElementById('speed');
  var perMin = document.getElementById('perMin');
  var col1 = document.getElementById('col1');
  var col2 = document.getElementById('col2');

  function fmt(n, d) {
    return n.toFixed(d).replace('.', ',');
  }

  function parseSpeed(s) {
    var v = parseFloat(String(s).trim().replace(',', '.'));
    return isFinite(v) && v >= 0 ? v : null;
  }

  function rows(from, to, speed) {
    var html = '';
    for (var m = from; m <= to; m++) {
      var km = speed === null ? '—' : fmt(m * speed / 60, 2);
      html += '<tr><td>' + m + '</td><td>' + km + '</td></tr>';
    }
    return html;
  }

  function render() {
    var speed = parseSpeed(input.value);
    if (speed === null) {
      perMin.textContent = 'Per minuut: —';
    } else {
      var km = speed / 60;
      perMin.innerHTML = 'Per minuut: <strong>' + fmt(km, 3) + ' km</strong> (' + Math.round(km * 1000) + ' m)';
      try { localStorage.setItem(KEY, input.value); } catch (e) {}
    }
    col1.innerHTML = rows(1, 30, speed);
    col2.innerHTML = rows(31, 60, speed);
  }

  try {
    var saved = localStorage.getItem(KEY);
    if (saved !== null && parseSpeed(saved) !== null) input.value = saved;
  } catch (e) {}

  input.addEventListener('input', render);
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
